# =====================================================================
#  cursorlink 설정 (config.toml)
# =====================================================================
#
#  배치:   [왼쪽 슬레이브]  ←  [마스터]  →  [오른쪽 슬레이브]
#          마스터 = 마우스/키보드가 꽂힌 PC. 슬레이브는 한쪽만 있어도 됨.
#
#  ※ # 으로 시작하는 줄은 전부 설명 (주석) 이라 고쳐도 아무 효과 없음.
#     실제 설정은 # 이 없는  이름 = 값  줄. 키를 바꾸려면 그 줄의 값을 바꿔야 함.
#
#  ※ 슬레이브 PC 는 "1. 공통" 만 맞추면 끝.
#     (mode = "slave", peer_ip = 마스터 주소, shared_secret = 마스터와 같은 값)
#     2번부터는 전부 마스터 전용이라 슬레이브에선 무시됨.
#     슬레이브가 왼쪽인지 오른쪽인지는 마스터가 알려주므로 따로 설정 없음.
#
#  ─── 용어 ───────────────────────────────────────────────────────
#   쓸어넘기기 : 마우스를 마스터 화면 왼쪽/오른쪽 끝으로 밀면 그 쪽 슬레이브로 넘어감
#   복귀       : 슬레이브 화면에서 마스터 쪽 끝으로 밀면 마스터로 돌아옴 (항상 동작)
#                (오른쪽 슬레이브는 화면 왼쪽 끝, 왼쪽 슬레이브는 화면 오른쪽 끝)
#   미러       : 마스터 + 고른 슬레이브를 동시에 조작 (같은 위치 클릭 / 같은 키 입력)
#
#  ─── 단축키 요약 (아래 설정값 기준) ──────────────────────────────
#   [마스터 쓰는 중]
#     num/        왼쪽 슬레이브로 이동
#     num-        오른쪽 슬레이브로 이동
#     num*        미러 켜기
#
#   [슬레이브 쓰는 중]
#     num.        마스터로 복귀
#     num/ num- num*   단축키 아님 → 슬레이브에 그냥 / - * 입력됨
#                 (다른 슬레이브로 가려면 num. 로 복귀한 다음 num/ 또는 num-)
#
#   [미러 중]
#     num*        미러 끄기
#     num/        왼쪽 슬레이브를 미러에서 빼기 / 다시 넣기
#     num-        오른쪽 슬레이브를 미러에서 빼기 / 다시 넣기
#     (빼기/넣기 전용 키를 따로 정하려면 5번의 hotkey_mirror_left / hotkey_mirror_right)
#
#   [언제든]
#     ctrl+num/   왼쪽 쓸어넘기기 켜기/끄기
#     ctrl+num-   오른쪽 쓸어넘기기 켜기/끄기
#     numplus     쓸어넘기기 양쪽 켜기/끄기
#     ctrl+alt+shift+k   cursorlink 전체 켜기/끄기
#
#   켜고 끌 때마다 화면 오른쪽 아래에 알림이 뜸.
#   트레이 아이콘 우클릭 메뉴에서도 연결 상태 / 쓸어넘기기 / 미러 대상을 보고 바꿀 수 있음.
#
#  ─── 단축키 적는 법 ─────────────────────────────────────────────
#   "ctrl+alt+k" 처럼 + 로 연결. "" (빈 값) 이면 그 기능 꺼짐.
#   modifier : ctrl, alt, shift, win
#   키       : a~z, 0~9, f1~f12, space, enter, tab, esc, home, end, pgup, pgdn,
#              ins, del, left, right, up, down
#              (del = End 옆 Delete 키)
#   넘패드   : num0~num9, num/ num* num- num. numplus
#              (넘패드 + 는 "num+" 로 쓰면 안 되고 "numplus")
#              (넘패드 . / Del 키는 "num.". 복귀/미러 전용 키로 쓸 땐 NumLock 꺼져 있어도 됨)
#   단축키로 정한 키는 대부분 원래 글자 입력이 안 됨 (예: num/ 로 정하면 넘패드 / 입력 불가).
#
#  설정을 바꾼 뒤에는 cursorlink 를 껐다 켜야 적용됨 (트레이 우클릭 → 종료 → 다시 실행).
# =====================================================================


# ---------------------------------------------------------------------
#  1. 공통 (마스터 / 슬레이브 모두)
# ---------------------------------------------------------------------

# 이 PC 의 역할: "master" 또는 "slave"
mode = "master"

# 상대 PC 주소 (IP 또는 Windows 컴퓨터 이름)
#   마스터   : 오른쪽 슬레이브 주소. 오른쪽 슬레이브가 없으면 ""
#   슬레이브 : 마스터 주소
peer_ip = "192.168.0.20"

# 통신 포트. 모든 PC 가 같은 값이어야 함 (보통 그대로 둠)
udp_port = 46011
tcp_port = 46012

# 비밀값. 모든 PC 가 글자 하나까지 똑같아야 연결됨 (16자 이상 권장)
shared_secret = "change-me-to-random-string"

# Windows 시작할 때 자동 실행 (true 권장). 바꾸면 다음 부팅부터 바로 반영됨
autostart = false

# 관리자 권한으로 실행 (슬레이브는 true 권장)
#   true 면 슬레이브의 관리자 권한 프로그램 창 (설치 프로그램, 작업관리자, 관리자로 실행한
#   프로그램과 그 팝업) 에서도 공유 마우스/키보드가 먹힘. false 면 그런 창에선 클릭/키가 안 먹힘.
#   - 직접 실행할 때 UAC 확인창이 한 번 뜸 ("예" 눌러야 함)
#   - autostart = true 면 작업 스케줄러에 등록돼서, 로그인할 때 확인창 없이 관리자로 자동 실행
#   - UAC 확인창 ("예/아니요", 화면 어두워지는 것) 과 잠금화면은 이걸로도 조작 안 됨
#     → 그 PC 의 UAC 를 "알리지 않음" 으로 (제어판 → 사용자 계정 → 사용자 계정 컨트롤 설정)
#   - 게임 (안티치트) 돌리는 PC 는 false 권장
run_as_admin = false

# 이 PC 의 cursorlink 전체 켜기/끄기
#   마스터에서 끄면: 쓸어넘기기 / 단축키 이동 / 미러 전부 멈춤 (슬레이브 쓰는 중이면 마스터로 복귀)
#   슬레이브에서 끄면: 마스터가 이 슬레이브로 못 넘어옴
hotkey_toggle = "ctrl+alt+shift+k"


# ---------------------------------------------------------------------
#  2. 왼쪽 슬레이브 (마스터 전용)
# ---------------------------------------------------------------------

# 왼쪽 슬레이브 주소 (IP 또는 컴퓨터 이름). 왼쪽 슬레이브가 없으면 ""
left_peer_ip = ""


# ---------------------------------------------------------------------
#  3. 슬레이브로 이동 / 마스터로 복귀 단축키 (마스터 전용)
# ---------------------------------------------------------------------

# 아래 두 키는 마스터를 쓰는 중에만 단축키로 동작.
# 슬레이브를 쓰는 중에는 단축키가 아니라 슬레이브에 그냥 입력됨 (num/ 면 / 가 입력).

# 왼쪽 슬레이브로 이동. 커서는 왼쪽 슬레이브 화면 가운데에 나타남.
#   미러 중에는 이동 대신 "왼쪽 슬레이브를 미러에서 빼기 / 다시 넣기"
hotkey_transfer_left = "num/"

# 오른쪽 슬레이브로 이동. (이름이 hotkey_transfer 인 건 예전 버전 호환 때문)
#   미러 중에는 이동 대신 "오른쪽 슬레이브를 미러에서 빼기 / 다시 넣기"
hotkey_transfer = "num-"

# 마스터로 복귀. 슬레이브를 쓰는 중에만 동작하고,
# 마스터를 쓰는 중에는 그냥 일반 키로 입력됨 (num. 이면 . 이 입력됨).
hotkey_return = "num."


# ---------------------------------------------------------------------
#  4. 쓸어넘기기 (마스터 전용)
# ---------------------------------------------------------------------
#  꺼도 단축키 이동은 되고, 슬레이브 → 마스터 복귀 (화면 끝으로 밀기) 도 항상 됨.
#  예) 왼쪽 노트북은 화면 끝으로 밀어서 가고, 오른쪽 PC 는 단축키로만 가고 싶으면
#      edge_switch_right = false

# 켜기/끄기 단축키
hotkey_edge_left   = "ctrl+num/"   # 왼쪽만   (화면 왼쪽 끝 → 왼쪽 슬레이브)
hotkey_edge_right  = "ctrl+num-"   # 오른쪽만 (화면 오른쪽 끝 → 오른쪽 슬레이브)
hotkey_edge_toggle = "numplus"     # 양쪽 한번에 (하나라도 켜져 있으면 다 끄고, 다 꺼져 있으면 다 켬)

# cursorlink 켤 때 상태 (true = 쓸어넘기기 켜짐)
edge_switch_left  = true
edge_switch_right = true


# ---------------------------------------------------------------------
#  5. 미러 (마스터 전용)
# ---------------------------------------------------------------------
#  미러 = 마스터 + 미러 대상 슬레이브를 동시에 조작.
#  미러 대상 바꾸기 (미러 켜진 상태에서):
#    num/  (또는 hotkey_mirror_left)  → 왼쪽 슬레이브 빼기 / 다시 넣기
#    num-  (또는 hotkey_mirror_right) → 오른쪽 슬레이브 빼기 / 다시 넣기
#    또는 트레이 메뉴 "미러 대상: 왼쪽 / 오른쪽" 체크
#  바꾼 조합은 기억했다가 다음에 미러 켤 때 그대로 씀 (cursorlink 재시작하면 아래 시작값으로).

# 미러 켜기/끄기 단축키. "" 면 미러 기능 안 씀.
hotkey_mirror = "num*"

# 미러 대상 빼기/넣기 전용 키. 미러 중에만 동작하고, 미러 아닐 땐 원래 키로 그대로 입력됨.
#   예) hotkey_mirror_left = "del"  → 미러 중에 Delete 누르면 왼쪽 빼기/넣기
#       (미러 중에는 Delete 로 지우기 안 됨. 미러 아닐 땐 Delete 정상)
#   "" 면 위의 num/ num- 로만 빼기/넣기.
hotkey_mirror_left  = ""
hotkey_mirror_right = ""

# cursorlink 켤 때 미러 대상 (false = 미러에서 제외)
#   예) 왼쪽 노트북은 항상 미러에서 빼고 싶으면 mirror_left = false
mirror_left  = true
mirror_right = true


# ---------------------------------------------------------------------
#  6. 기타 (마스터 전용)
# ---------------------------------------------------------------------

# 슬레이브를 쓰는 중에 키보드도 슬레이브로 보낼지.
#   true  : 마우스 + 키보드 모두 슬레이브로
#   false : 마우스만 슬레이브로, 키보드는 마스터에 그대로 입력됨
#           (슬레이브에서 게임할 때 키보드는 슬레이브 자체 키보드로 쓰는 경우)
forward_keyboard = true
