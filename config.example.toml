# cursorlink 설정 예시
# 이 파일을 config.toml 로 복사해서 사용
#
# 배치: [왼쪽 슬레이브] ← [마스터] → [오른쪽 슬레이브]  (슬레이브는 한쪽만 있어도 됨)
# 슬레이브는 mode = "slave" + peer_ip(마스터 주소) + shared_secret 만 맞추면 됨.
# 자기가 왼쪽인지 오른쪽인지는 마스터가 알려주므로 슬레이브 쪽 설정은 필요 없음.

# 역할: "master" 또는 "slave"
mode = "master"

# master: 오른쪽 슬레이브 주소 (빈 문자열이면 오른쪽 없음)
# slave : 마스터 주소
# IP 또는 Windows 컴퓨터 이름 둘 다 가능
peer_ip = "172.30.1.48"

# master 전용: 왼쪽 슬레이브 주소. 빈 문자열이면 왼쪽 없음.
left_peer_ip = ""

# UDP 입력 포트 / TCP 제어 포트 (모든 PC 동일)
udp_port = 46011
tcp_port = 46012

# 사전 공유 키 (모든 PC 동일하게 설정, 최소 16자)
shared_secret = "change-me-to-random-string"

# 기능 on/off 단축키
# 지원 modifier: ctrl, alt, shift, win
# 지원 키: a-z, 0-9, f1-f12, space, enter, tab, esc, home, end, pgup, pgdn, ins, del, 방향키
#           num0-num9, num* (numpad *), num- num/ num. numplus (numpad +, "num+" 는 안 됨)
hotkey_toggle = "ctrl+alt+shift+k"

# Mirror 모드 (Master + 슬레이브 동시 조작) on/off 단축키.
# 미러 중엔 아래 왼쪽/오른쪽 단축키가 그 슬레이브를 미러 대상에 넣기/빼기로 바뀜.
# 빈 문자열이면 Mirror 기능 비활성. 예: "num*" 또는 "ctrl+shift+m"
hotkey_mirror = ""

# 오른쪽 슬레이브로 즉시 전환 단축키. 슬레이브 커서는 화면 중앙에 놓임.
# 슬레이브 조작 중에 누르면 마스터를 거치지 않고 바로 오른쪽 슬레이브로.
# 빈 문자열이면 비활성 (엣지 크로싱만 사용). 예: "num-"
hotkey_transfer = ""

# 왼쪽 슬레이브로 즉시 전환 단축키. 동작은 hotkey_transfer 와 같음. 예: "num/"
hotkey_transfer_left = ""

# 슬레이브 → Master 복귀 단축키. 슬레이브로 forward 안 되고 Master 로 돌아옴.
# 빈 문자열이면 비활성. 예: "num."
hotkey_return = ""

# 쓸어넘기기 (마스터 화면 끝에 마우스 닿으면 슬레이브로 전환) on/off 단축키.
# 꺼도 단축키 전환과 슬레이브 → 마스터 복귀 (슬레이브 화면 끝) 는 그대로 동작.
# 빈 문자열이면 비활성. 예: "numplus"
hotkey_edge_toggle = ""

# 시작 시 쓸어넘기기 사용 여부
edge_switch = true

# Windows 시작 시 자동 실행 (레지스트리 HKCU\Run 사용)
autostart = false

# Remote 상태에서 키보드도 Slave 로 넘길지 (true) 아니면 마우스만 넘길지 (false).
# false 로 하면 Slave 는 자체 키보드로 조작. Slave 에 게임 켜져있을 때 유용.
forward_keyboard = true
